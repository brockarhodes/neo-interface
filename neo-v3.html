<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Neo V3</title>

  <style>
    :root {
      --bg: #020812;
      --blue: #43c8ff;
      --orange: #ff9d35;
      --text: #f4f7fb;
      --muted: #8291a3;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(
          circle at 50% 54%,
          rgba(22, 113, 159, 0.14),
          transparent 31%
        ),
        radial-gradient(
          circle at 67% 54%,
          rgba(185, 91, 22, 0.045),
          transparent 25%
        ),
        linear-gradient(
          180deg,
          #020711 0%,
          #04101c 55%,
          #020812 100%
        );
    }

    .neo-app {
      width: 100%;
      height: 100dvh;
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      padding:
        max(28px, env(safe-area-inset-top))
        24px
        max(16px, env(safe-area-inset-bottom));
    }

    .neo-header {
      text-align: center;
      padding-top: 5px;
    }

    .neo-brand {
      font-size: 34px;
      font-weight: 650;
      letter-spacing: -0.5px;

      background: linear-gradient(
        90deg,
        #55d7ff 15%,
        #b6eaff 48%,
        #ffad45 78%
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .neo-tagline {
      margin-top: 5px;
      font-size: 8px;
      letter-spacing: 2.3px;
      color: #8193a5;
    }

    .greeting {
      margin-top: 58px;
    }

    .greeting-main {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -0.3px;
    }

    .greeting-sub {
      margin-top: 7px;
      font-size: 14px;
      color: var(--muted);
    }

    .orb-area {
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 300px;
    }

    .orb-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #neoOrb {
      width: min(92vw, 470px);
      height: min(92vw, 470px);

      cursor: pointer;
      touch-action: manipulation;
    }

    .voice-status {
      margin-top: -20px;
      min-height: 22px;

      color: #71889a;

      font-size: 12px;
      letter-spacing: 0.3px;
      text-align: center;

      transition:
        color 0.3s ease,
        opacity 0.3s ease;
    }

    .voice-status.listening {
      color: #83dfff;
    }

    .voice-status.success {
      color: #d6edf7;
    }

    .voice-status.error {
      color: var(--orange);
    }

    .quote {
      display: flex;
      align-items: center;
      gap: 13px;

      margin-bottom: 22px;
    }

    .quote-line {
      flex: 1;
      height: 1px;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(92, 144, 174, 0.4)
      );
    }

    .quote-line:last-child {
      transform: scaleX(-1);
    }

    .quote-text {
      color: #718294;
      font-size: 10px;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }

    .bottom-nav {
      height: 68px;

      border: 1px solid rgba(80, 120, 145, 0.18);

      background: rgba(4, 15, 26, 0.82);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-radius: 22px;

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      padding: 7px 4px;
    }

    .nav-item {
      border: 0;
      background: transparent;
      color: #617284;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      font: inherit;
      font-size: 9px;

      gap: 3px;
    }

    .nav-icon {
      font-size: 21px;
      line-height: 22px;
    }

    .nav-item.active {
      color: var(--blue);
    }
  </style>
</head>

<body>

  <main class="neo-app">

    <header class="neo-header">

      <div class="neo-brand">
        Neo
      </div>

      <div class="neo-tagline">
        LISTENS&nbsp;&nbsp; THINKS&nbsp;&nbsp; CONNECTS&nbsp;&nbsp; HELPS
      </div>

    </header>


    <section class="greeting">

      <div
        id="greeting"
        class="greeting-main"
      >
        Good morning, Brock.
      </div>

      <div class="greeting-sub">
        How can I help?
      </div>

    </section>


    <section class="orb-area">

      <div class="orb-stack">

        <canvas id="neoOrb"></canvas>

        <div
          id="voiceStatus"
          class="voice-status"
        >
          Tap Neo to speak
        </div>

      </div>

    </section>


    <section class="quote">

      <div class="quote-line"></div>

      <div class="quote-text">
        Progress happens when intent meets action.
      </div>

      <div class="quote-line"></div>

    </section>


    <nav class="bottom-nav">

      <button class="nav-item active">
        <span class="nav-icon">⌂</span>
        <span>Home</span>
      </button>

      <button class="nav-item">
        <span class="nav-icon">✦</span>
        <span>Explore</span>
      </button>

      <button class="nav-item">
        <span class="nav-icon">◎</span>
        <span>Memory</span>
      </button>

      <button class="nav-item">
        <span class="nav-icon">⚙</span>
        <span>Settings</span>
      </button>

    </nav>

  </main>


  <script>
    (() => {

      /* ======================================================
         ELEMENTS
      ====================================================== */

      const canvas =
        document.getElementById('neoOrb');

      const ctx =
        canvas.getContext('2d');

      const voiceStatus =
        document.getElementById('voiceStatus');

      const greetingElement =
        document.getElementById('greeting');


      /* ======================================================
         GREETING
      ====================================================== */

      const hour =
        new Date().getHours();

      let greeting =
        'Good evening';

      if (hour < 12) {
        greeting = 'Good morning';
      }
      else if (hour < 17) {
        greeting = 'Good afternoon';
      }

      greetingElement.textContent =
        `${greeting}, Brock.`;


      /* ======================================================
         STATE
      ====================================================== */

      let width;
      let height;
      let centerX;
      let centerY;

      let time = 0;

      let nodes = [];

      let audioLevel = 0;

      let listening = false;

      const NODE_COUNT = 68;


      /* ======================================================
         CANVAS
      ====================================================== */

      function resize() {

        const rect =
          canvas.getBoundingClientRect();

        const dpr =
          Math.min(
            window.devicePixelRatio || 1,
            2
          );

        canvas.width =
          rect.width * dpr;

        canvas.height =
          rect.height * dpr;

        ctx.setTransform(
          dpr,
          0,
          0,
          dpr,
          0,
          0
        );

        width =
          rect.width;

        height =
          rect.height;

        centerX =
          width / 2;

        centerY =
          height / 2;

        createNodes();

      }


      /* ======================================================
         NEURAL NETWORK
      ====================================================== */

      function createNodes() {

        nodes = [];

        const radius =
          Math.min(width, height) *
          0.255;

        for (
          let i = 0;
          i < NODE_COUNT;
          i++
        ) {

          const angle =
            Math.random() *
            Math.PI *
            2;

          const distance =
            Math.sqrt(Math.random()) *
            radius;

          nodes.push({

            angle,

            distance,

            /*
              V3:
              intentionally slow.
            */

            speed:
              (
                Math.random() *
                0.00023 +
                0.00007
              ) *
              (
                Math.random() > 0.5
                  ? 1
                  : -1
              ),

            wobble:
              Math.random() *
              Math.PI *
              2,

            size:
              Math.random() *
              1.55 +
              0.75,

            orange:
              Math.random() >
              0.87

          });

        }

      }


      /* ======================================================
         NODE POSITION
      ====================================================== */

      function getNodePosition(node) {

        /*
          Calm, slow breathing.
        */

        const breathing =
          Math.sin(
            time * 0.00075
          ) *
          0.022;


        /*
          Voice causes only a SMALL
          physical expansion.

          Most voice feedback comes from
          light instead.
        */

        const voiceExpansion =
          audioLevel *
          0.065;


        const breathe =
          1 +
          breathing +
          voiceExpansion;


        const wobble =
          Math.sin(
            time * 0.0008 +
            node.wobble
          ) *
          (
            3.1 +
            audioLevel * 0.7
          );


        /*
          Listening barely increases
          rotation speed.
        */

        const speedBoost =
          listening
            ? 1.08
            : 1;


        const angle =
          node.angle +
          time *
          node.speed *
          speedBoost;


        const distance =
          node.distance *
          breathe +
          wobble;


        return {

          x:
            centerX +
            Math.cos(angle) *
            distance,

          y:
            centerY +
            Math.sin(angle) *
            distance

        };

      }


      /* ======================================================
         LARGE AMBIENT BACKGROUND GLOW
      ====================================================== */

      function drawAmbientGlow() {

        const size =
          Math.min(width, height);


        /*
          Wide, soft blue atmospheric glow.
        */

        const blueRadius =
          size *
          (
            0.43 +
            Math.sin(
              time * 0.00055
            ) *
            0.012
          );


        const blueGlow =
          ctx.createRadialGradient(
            centerX - size * 0.035,
            centerY,
            size * 0.06,
            centerX,
            centerY,
            blueRadius
          );


        blueGlow.addColorStop(
          0,
          `rgba(
            38,
            165,
            220,
            ${0.095 + audioLevel * 0.08}
          )`
        );

        blueGlow.addColorStop(
          0.35,
          `rgba(
            24,
            122,
            176,
            ${0.065 + audioLevel * 0.055}
          )`
        );

        blueGlow.addColorStop(
          0.7,
          'rgba(13,79,120,0.025)'
        );

        blueGlow.addColorStop(
          1,
          'rgba(0,0,0,0)'
        );


        ctx.fillStyle =
          blueGlow;

        ctx.beginPath();

        ctx.arc(
          centerX,
          centerY,
          blueRadius,
          0,
          Math.PI * 2
        );

        ctx.fill();


        /*
          Very restrained warm glow
          on Neo's right side.
        */

        const orangeGlow =
          ctx.createRadialGradient(
            centerX + size * 0.17,
            centerY + size * 0.02,
            0,
            centerX + size * 0.17,
            centerY + size * 0.02,
            size * 0.27
          );


        orangeGlow.addColorStop(
          0,
          `rgba(
            255,
            135,
            40,
            ${0.035 + audioLevel * 0.035}
          )`
        );

        orangeGlow.addColorStop(
          1,
          'rgba(0,0,0,0)'
        );


        ctx.fillStyle =
          orangeGlow;

        ctx.beginPath();

        ctx.arc(
          centerX + size * 0.17,
          centerY + size * 0.02,
          size * 0.27,
          0,
          Math.PI * 2
        );

        ctx.fill();

      }


      /* ======================================================
         INNER ORB GLOW
      ====================================================== */

      function drawInnerGlow() {

        const size =
          Math.min(width, height);


        const pulse =
          1 +
          Math.sin(
            time * 0.00085
          ) *
          0.025;


        const radius =
          size *
          0.29 *
          pulse;


        const gradient =
          ctx.createRadialGradient(
            centerX,
            centerY,
            radius * 0.05,
            centerX,
            centerY,
            radius
          );


        gradient.addColorStop(
          0,
          `rgba(
            35,
            177,
            232,
            ${0.10 + audioLevel * 0.19}
          )`
        );


        gradient.addColorStop(
          0.48,
          `rgba(
            21,
            119,
            169,
            ${0.045 + audioLevel * 0.08}
          )`
        );


        gradient.addColorStop(
          1,
          'rgba(0,0,0,0)'
        );


        ctx.fillStyle =
          gradient;


        ctx.beginPath();

        ctx.arc(
          centerX,
          centerY,
          radius,
          0,
          Math.PI * 2
        );

        ctx.fill();

      }


      /* ======================================================
         LISTENING RING
      ====================================================== */

      function drawListeningRing() {

        if (!listening) {
          return;
        }


        const size =
          Math.min(width, height);


        /*
          Always visible while listening,
          but intentionally subtle.
        */

        const energy =
          Math.max(
            audioLevel,
            0.04
          );


        const radius =
          size *
          (
            0.287 +
            energy * 0.018
          );


        const breath =
          Math.sin(
            time * 0.0016
          ) *
          (
            1.3 +
            energy * 1.5
          );


        ctx.save();


        /*
          Thin blue ring
        */

        ctx.beginPath();

        ctx.arc(
          centerX,
          centerY,
          radius + breath,
          0,
          Math.PI * 2
        );


        ctx.strokeStyle =
          `rgba(
            76,
            204,
            249,
            ${0.13 + energy * 0.36}
          )`;


        ctx.lineWidth =
          0.8 +
          energy * 1.25;


        ctx.shadowBlur =
          8 +
          energy * 11;


        ctx.shadowColor =
          'rgba(67,200,255,.65)';


        ctx.stroke();


        /*
          Slow orange accent arc.
        */

        const arcRotation =
          time * 0.00012;


        ctx.beginPath();

        ctx.arc(
          centerX,
          centerY,
          radius + 5,
          arcRotation - 0.55,
          arcRotation + 0.28
        );


        ctx.strokeStyle =
          `rgba(
            255,
            157,
            53,
            ${0.10 + energy * 0.34}
          )`;


        ctx.lineWidth =
          0.9 +
          energy * 0.8;


        ctx.shadowBlur =
          6 +
          energy * 8;


        ctx.shadowColor =
          'rgba(255,157,53,.55)';


        ctx.stroke();


        ctx.restore();

      }


      /* ======================================================
         CONNECTIONS
      ====================================================== */

      function drawConnections(
        positions
      ) {

        const maxDistance =
          Math.min(
            width,
            height
          ) *
          0.115;


        for (
          let i = 0;
          i < positions.length;
          i++
        ) {

          for (
            let j = i + 1;
            j < positions.length;
            j++
          ) {

            const dx =
              positions[i].x -
              positions[j].x;

            const dy =
              positions[i].y -
              positions[j].y;

            const distance =
              Math.sqrt(
                dx * dx +
                dy * dy
              );


            if (
              distance <
              maxDistance
            ) {

              const opacity =
                (
                  1 -
                  distance /
                  maxDistance
                ) *
                (
                  0.27 +
                  audioLevel *
                  0.33
                );


              const warm =
                nodes[i].orange ||
                nodes[j].orange;


              ctx.strokeStyle =
                warm
                  ? `rgba(
                      255,
                      151,
                      57,
                      ${opacity * 0.9}
                    )`
                  : `rgba(
                      64,
                      193,
                      238,
                      ${opacity}
                    )`;


              ctx.lineWidth =
                0.62 +
                audioLevel *
                0.18;


              ctx.beginPath();


              ctx.moveTo(
                positions[i].x,
                positions[i].y
              );


              ctx.lineTo(
                positions[j].x,
                positions[j].y
              );


              ctx.stroke();

            }

          }

        }

      }


      /* ======================================================
         NODES
      ====================================================== */

      function drawNodes(
        positions
      ) {

        positions.forEach(
          (position, index) => {

            const node =
              nodes[index];


            const color =
              node.orange
                ? '255,157,53'
                : '68,204,255';


            /*
              Voice response happens primarily
              through brightness.
            */

            ctx.shadowBlur =
              7 +
              audioLevel *
              17;


            ctx.shadowColor =
              `rgba(
                ${color},
                ${0.65 + audioLevel * 0.25}
              )`;


            ctx.fillStyle =
              `rgba(
                ${color},
                ${0.82 + audioLevel * 0.16}
              )`;


            ctx.beginPath();


            ctx.arc(
              position.x,
              position.y,
              node.size +
              audioLevel *
              0.45,
              0,
              Math.PI * 2
            );


            ctx.fill();

          }
        );


        ctx.shadowBlur = 0;

      }


      /* ======================================================
         SUBTLE ORBITING PARTICLES
      ====================================================== */

      function drawParticles() {

        const count =
          listening
            ? 13
            : 9;


        for (
          let i = 0;
          i < count;
          i++
        ) {

          const angle =
            time *
            0.000065 +
            i *
            (
              Math.PI *
              2 /
              count
            );


          const distance =
            Math.min(
              width,
              height
            ) *
            (
              0.31 +
              0.018 *
              Math.sin(
                time *
                0.00055 +
                i
              )
            );


          const x =
            centerX +
            Math.cos(angle) *
            distance;


          const y =
            centerY +
            Math.sin(angle) *
            distance;


          const orange =
            i % 6 === 0;


          ctx.fillStyle =
            orange
              ? `rgba(
                  255,
                  157,
                  53,
                  ${0.25 + audioLevel * 0.18}
                )`
              : `rgba(
                  75,
                  196,
                  240,
                  ${0.19 + audioLevel * 0.22}
                )`;


          ctx.beginPath();


          ctx.arc(
            x,
            y,
            0.75 +
            audioLevel *
            0.2,
            0,
            Math.PI * 2
          );


          ctx.fill();

        }

      }


      /* ======================================================
         ANIMATION
      ====================================================== */

      function animate(timestamp) {

        time =
          timestamp;


        ctx.clearRect(
          0,
          0,
          width,
          height
        );


        /*
          Order matters:
          atmosphere first,
          neural network above it.
        */

        drawAmbientGlow();

        drawInnerGlow();

        drawListeningRing();


        const positions =
          nodes.map(
            getNodePosition
          );


        drawConnections(
          positions
        );


        drawNodes(
          positions
        );


        drawParticles();


        requestAnimationFrame(
          animate
        );

      }


      /* ======================================================
         MICROPHONE
      ====================================================== */

      let stream = null;

      let audioContext = null;

      let analyser = null;

      let microphone = null;


      async function startListening() {

        if (listening) {

          stopListening();

          return;

        }


        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {

          voiceStatus.textContent =
            'Microphone unavailable in this browser.';

          voiceStatus.className =
            'voice-status error';

          return;

        }


        try {

          voiceStatus.textContent =
            'Requesting microphone…';

          voiceStatus.className =
            'voice-status listening';


          stream =
            await navigator.mediaDevices
              .getUserMedia({
                audio: true,
                video: false
              });


          audioContext =
            new (
              window.AudioContext ||
              window.webkitAudioContext
            )();


          analyser =
            audioContext
              .createAnalyser();


          analyser.fftSize =
            256;


          analyser.smoothingTimeConstant =
            0.72;


          microphone =
            audioContext
              .createMediaStreamSource(
                stream
              );


          microphone.connect(
            analyser
          );


          listening =
            true;


          voiceStatus.textContent =
            'Listening… tap again to stop';


          voiceStatus.className =
            'voice-status listening';


          monitorAudio();

        }

        catch (error) {

          console.error(
            error
          );


          voiceStatus.textContent =
            'Microphone permission was not allowed.';


          voiceStatus.className =
            'voice-status error';

        }

      }


      /* ======================================================
         AUDIO LEVEL
      ====================================================== */

      function monitorAudio() {

        if (
          !listening ||
          !analyser
        ) {
          return;
        }


        const data =
          new Uint8Array(
            analyser.frequencyBinCount
          );


        analyser.getByteFrequencyData(
          data
        );


        let total = 0;


        for (
          let i = 0;
          i < data.length;
          i++
        ) {

          total +=
            data[i];

        }


        const average =
          total /
          data.length;


        /*
          Still sensitive enough for normal
          conversation, but not exaggerated.
        */

        let target =
          average / 46;


        /*
          Ignore tiny room noise.
        */

        if (
          target <
          0.055
        ) {

          target = 0;

        }


        target =
          Math.min(
            target,
            1
          );


        /*
          Responsive attack.
          Gentle decay.
        */

        if (
          target >
          audioLevel
        ) {

          audioLevel =
            audioLevel *
            0.58 +
            target *
            0.42;

        }

        else {

          audioLevel =
            audioLevel *
            0.87 +
            target *
            0.13;

        }


        requestAnimationFrame(
          monitorAudio
        );

      }


      /* ======================================================
         STOP LISTENING
      ====================================================== */

      function stopListening() {

        listening =
          false;


        audioLevel =
          0;


        if (stream) {

          stream
            .getTracks()
            .forEach(
              track =>
                track.stop()
            );

        }


        if (audioContext) {

          audioContext.close();

        }


        stream =
          null;

        audioContext =
          null;

        analyser =
          null;

        microphone =
          null;


        voiceStatus.textContent =
          'Microphone test successful';


        voiceStatus.className =
          'voice-status success';

      }


      /* ======================================================
         TAP NEO
      ====================================================== */

      canvas.addEventListener(
        'click',
        () => {

          /*
            Smaller tap response than V2.
          */

          canvas.animate(
            [
              {
                transform:
                  'scale(1)'
              },
              {
                transform:
                  'scale(1.018)'
              },
              {
                transform:
                  'scale(1)'
              }
            ],
            {
              duration:
                500,

              easing:
                'ease-out'
            }
          );


          startListening();

        }
      );


      /* ======================================================
         STARTUP
      ====================================================== */

      window.addEventListener(
        'resize',
        resize
      );


      resize();


      requestAnimationFrame(
        animate
      );

    })();
  </script>

</body>
</html>
