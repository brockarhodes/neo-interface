<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Neo V2</title>

  <style>
    :root {
      --bg: #020812;
      --blue: #43c8ff;
      --orange: #ff9d35;
      --text: #f4f7fb;
      --muted: #8291a3;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(
          circle at 50% 55%,
          rgba(18, 91, 125, 0.16),
          transparent 36%
        ),
        linear-gradient(
          180deg,
          #020812 0%,
          #04101d 65%,
          #020812 100%
        );
    }

    .neo-app {
      width: 100%;
      height: 100dvh;
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      padding:
        max(28px, env(safe-area-inset-top))
        24px
        max(16px, env(safe-area-inset-bottom));
    }

    .neo-header {
      text-align: center;
      padding-top: 5px;
    }

    .neo-brand {
      font-size: 34px;
      font-weight: 650;
      letter-spacing: -0.5px;

      background: linear-gradient(
        90deg,
        #55d7ff 15%,
        #b6eaff 48%,
        #ffad45 78%
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .neo-tagline {
      margin-top: 5px;
      font-size: 8px;
      letter-spacing: 2.3px;
      color: #8193a5;
    }

    .greeting {
      margin-top: 58px;
    }

    .greeting-main {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -0.3px;
    }

    .greeting-sub {
      margin-top: 7px;
      font-size: 14px;
      color: var(--muted);
    }

    .orb-area {
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 300px;
    }

    .orb-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #neoOrb {
      width: min(92vw, 470px);
      height: min(92vw, 470px);

      cursor: pointer;
      touch-action: manipulation;

      transition:
        transform 0.2s ease,
        filter 0.2s ease;
    }

    .voice-status {
      margin-top: -20px;
      min-height: 22px;

      color: #71889a;

      font-size: 12px;
      letter-spacing: 0.3px;
      text-align: center;

      transition:
        color 0.25s ease,
        opacity 0.25s ease;
    }

    .voice-status.listening {
      color: var(--blue);
    }

    .voice-status.success {
      color: #d6edf7;
    }

    .voice-status.error {
      color: var(--orange);
    }

    .quote {
      display: flex;
      align-items: center;
      gap: 13px;

      margin-bottom: 22px;
    }

    .quote-line {
      flex: 1;
      height: 1px;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(92, 144, 174, 0.45)
      );
    }

    .quote-line:last-child {
      transform: scaleX(-1);
    }

    .quote-text {
      color: #718294;
      font-size: 10px;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }

    .bottom-nav {
      height: 68px;

      border: 1px solid rgba(80, 120, 145, 0.18);

      background:
        rgba(4, 15, 26, 0.82);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-radius: 22px;

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      padding: 7px 4px;
    }

    .nav-item {
      border: 0;
      background: transparent;
      color: #617284;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      font: inherit;
      font-size: 9px;

      gap: 3px;
    }

    .nav-icon {
      font-size: 21px;
      line-height: 22px;
    }

    .nav-item.active {
      color: var(--blue);
    }
  </style>
</head>

<body>

  <main class="neo-app">

    <header class="neo-header">

      <div class="neo-brand">
        Neo
      </div>

      <div class="neo-tagline">
        LISTENS&nbsp;&nbsp; THINKS&nbsp;&nbsp; CONNECTS&nbsp;&nbsp; HELPS
      </div>

    </header>


    <section class="greeting">

      <div
        id="greeting"
        class="greeting-main"
      >
        Good morning, Brock.
      </div>

      <div class="greeting-sub">
        How can I help?
      </div>

    </section>


    <section class="orb-area">

      <div class="orb-stack">

        <canvas id="neoOrb"></canvas>

        <div
          id="voiceStatus"
          class="voice-status"
        >
          Tap Neo to speak
        </div>

      </div>

    </section>


    <section class="quote">

      <div class="quote-line"></div>

      <div class="quote-text">
        Progress happens when intent meets action.
      </div>

      <div class="quote-line"></div>

    </section>


    <nav class="bottom-nav">

      <button class="nav-item active">
        <span class="nav-icon">⌂</span>
        <span>Home</span>
      </button>

      <button class="nav-item">
        <span class="nav-icon">✦</span>
        <span>Explore</span>
      </button>

      <button class="nav-item">
        <span class="nav-icon">◎</span>
        <span>Memory</span>
      </button>

      <button class="nav-item">
        <span class="nav-icon">⚙</span>
        <span>Settings</span>
      </button>

    </nav>

  </main>


  <script>
    (() => {

      /* ======================================================
         ELEMENTS
      ====================================================== */

      const canvas =
        document.getElementById('neoOrb');

      const ctx =
        canvas.getContext('2d');

      const voiceStatus =
        document.getElementById('voiceStatus');

      const greetingElement =
        document.getElementById('greeting');


      /* ======================================================
         GREETING
      ====================================================== */

      const hour =
        new Date().getHours();

      let greeting =
        'Good evening';

      if (hour < 12) {
        greeting = 'Good morning';
      }
      else if (hour < 17) {
        greeting = 'Good afternoon';
      }

      greetingElement.textContent =
        `${greeting}, Brock.`;


      /* ======================================================
         ORB STATE
      ====================================================== */

      let width;
      let height;
      let centerX;
      let centerY;

      let time = 0;

      let nodes = [];

      let audioLevel = 0;

      let listening = false;

      const NODE_COUNT = 70;


      /* ======================================================
         CANVAS SETUP
      ====================================================== */

      function resize() {

        const rect =
          canvas.getBoundingClientRect();

        const dpr =
          Math.min(
            window.devicePixelRatio || 1,
            2
          );

        canvas.width =
          rect.width * dpr;

        canvas.height =
          rect.height * dpr;

        ctx.setTransform(
          dpr,
          0,
          0,
          dpr,
          0,
          0
        );

        width =
          rect.width;

        height =
          rect.height;

        centerX =
          width / 2;

        centerY =
          height / 2;

        createNodes();

      }


      /* ======================================================
         CREATE NEURAL NETWORK
      ====================================================== */

      function createNodes() {

        nodes = [];

        const radius =
          Math.min(width, height) *
          0.265;

        for (
          let i = 0;
          i < NODE_COUNT;
          i++
        ) {

          const angle =
            Math.random() *
            Math.PI *
            2;

          const distance =
            Math.sqrt(
              Math.random()
            ) *
            radius;

          nodes.push({

            angle,

            distance,

            speed:
              (
                Math.random() *
                0.0008 +
                0.00018
              ) *
              (
                Math.random() > 0.5
                  ? 1
                  : -1
              ),

            wobble:
              Math.random() *
              Math.PI *
              2,

            size:
              Math.random() *
              1.8 +
              0.8,

            orange:
              Math.random() >
              0.84

          });

        }

      }


      /* ======================================================
         NODE POSITION
      ====================================================== */

      function getNodePosition(node) {

        const idleBreathing =
          Math.sin(
            time * 0.0011
          ) *
          0.035;

        const voiceExpansion =
          audioLevel *
          0.24;

        const breathe =
          1 +
          idleBreathing +
          voiceExpansion;

        const wobble =
          Math.sin(
            time * 0.0015 +
            node.wobble
          ) *
          (
            5 +
            audioLevel * 4
          );

        const speedBoost =
          listening
            ? 1 + audioLevel * 1.7
            : 1;

        const angle =
          node.angle +
          time *
          node.speed *
          speedBoost;

        const distance =
          node.distance *
          breathe +
          wobble;

        return {

          x:
            centerX +
            Math.cos(angle) *
            distance,

          y:
            centerY +
            Math.sin(angle) *
            distance

        };

      }


      /* ======================================================
         BACKGROUND GLOW
      ====================================================== */

      function drawGlow() {

        const pulse =
          1 +
          Math.sin(
            time * 0.0012
          ) *
          0.06 +
          audioLevel *
          0.32;

        const radius =
          Math.min(
            width,
            height
          ) *
          0.31 *
          pulse;

        const gradient =
          ctx.createRadialGradient(
            centerX,
            centerY,
            radius * 0.05,
            centerX,
            centerY,
            radius
          );

        gradient.addColorStop(
          0,
          `rgba(
            28,
            170,
            230,
            ${0.11 + audioLevel * 0.42}
          )`
        );

        gradient.addColorStop(
          0.5,
          `rgba(
            17,
            112,
            164,
            ${0.06 + audioLevel * 0.10}
          )`
        );

        gradient.addColorStop(
          1,
          'rgba(0,0,0,0)'
        );

        ctx.fillStyle =
          gradient;

        ctx.beginPath();

        ctx.arc(
          centerX,
          centerY,
          radius,
          0,
          Math.PI * 2
        );

        ctx.fill();

      }


      /* ======================================================
         VOICE ENERGY RINGS
      ====================================================== */

      function drawAudioRing() {

        if (!listening) {
          return;
        }

        const minimumEnergy =
          0.08;

        const energy =
          Math.max(
            audioLevel,
            minimumEnergy
          );

        const baseRadius =
          Math.min(
            width,
            height
          ) *
          (
            0.295 +
            energy *
            0.075
          );

        const pulse =
          Math.sin(
            time *
            (
              0.006 +
              energy *
              0.008
            )
          ) *
          (
            2 +
            energy * 5
          );


        ctx.save();


        /*
          BLUE PRIMARY RING
        */

        ctx.beginPath();

        ctx.arc(
          centerX,
          centerY,
          baseRadius + pulse,
          0,
          Math.PI * 2
        );

        ctx.strokeStyle =
          `rgba(
            67,
            200,
            255,
            ${0.12 + energy * 0.72}
          )`;

        ctx.lineWidth =
          1 +
          energy *
          3.2;

        ctx.shadowBlur =
          12 +
          energy *
          30;

        ctx.shadowColor =
          'rgba(67,200,255,.9)';

        ctx.stroke();


        /*
          OUTER FAINT RING
        */

        ctx.beginPath();

        ctx.arc(
          centerX,
          centerY,
          baseRadius +
          10 +
          pulse * 0.55,
          0,
          Math.PI * 2
        );

        ctx.strokeStyle =
          `rgba(
            67,
            200,
            255,
            ${0.04 + energy * 0.24}
          )`;

        ctx.lineWidth =
          0.7 +
          energy *
          1.2;

        ctx.shadowBlur =
          7 +
          energy *
          12;

        ctx.stroke();


        /*
          ORANGE ENERGY ARC
        */

        const arcRotation =
          time *
          0.00035;

        ctx.beginPath();

        ctx.arc(
          centerX,
          centerY,
          baseRadius +
          6 +
          pulse * 0.4,
          arcRotation - 0.75,
          arcRotation + 0.65
        );

        ctx.strokeStyle =
          `rgba(
            255,
            157,
            53,
            ${0.10 + energy * 0.65}
          )`;

        ctx.lineWidth =
          1 +
          energy *
          2.3;

        ctx.shadowBlur =
          10 +
          energy *
          22;

        ctx.shadowColor =
          'rgba(255,157,53,.85)';

        ctx.stroke();


        ctx.restore();

      }


      /* ======================================================
         CONNECTIONS
      ====================================================== */

      function drawConnections(
        positions
      ) {

        const maxDistance =
          Math.min(
            width,
            height
          ) *
          (
            0.115 +
            audioLevel *
            0.012
          );

        for (
          let i = 0;
          i < positions.length;
          i++
        ) {

          for (
            let j = i + 1;
            j < positions.length;
            j++
          ) {

            const dx =
              positions[i].x -
              positions[j].x;

            const dy =
              positions[i].y -
              positions[j].y;

            const distance =
              Math.sqrt(
                dx * dx +
                dy * dy
              );

            if (
              distance <
              maxDistance
            ) {

              const opacity =
                (
                  1 -
                  distance /
                  maxDistance
                ) *
                (
                  0.34 +
                  audioLevel *
                  0.72
                );

              const warm =
                nodes[i].orange ||
                nodes[j].orange;

              ctx.strokeStyle =
                warm
                  ? `rgba(
                      255,
                      145,
                      42,
                      ${opacity}
                    )`
                  : `rgba(
                      58,
                      193,
                      244,
                      ${opacity}
                    )`;

              ctx.lineWidth =
                0.7 +
                audioLevel *
                0.35;

              ctx.beginPath();

              ctx.moveTo(
                positions[i].x,
                positions[i].y
              );

              ctx.lineTo(
                positions[j].x,
                positions[j].y
              );

              ctx.stroke();

            }

          }

        }

      }


      /* ======================================================
         NODES
      ====================================================== */

      function drawNodes(
        positions
      ) {

        positions.forEach(
          (position, index) => {

            const node =
              nodes[index];

            const color =
              node.orange
                ? '255,157,53'
                : '68,204,255';

            ctx.shadowBlur =
              10 +
              audioLevel *
              34;

            ctx.shadowColor =
              `rgba(
                ${color},
                .9
              )`;

            ctx.fillStyle =
              `rgba(
                ${color},
                .95
              )`;

            ctx.beginPath();

            ctx.arc(
              position.x,
              position.y,
              node.size +
              audioLevel *
              1.7,
              0,
              Math.PI * 2
            );

            ctx.fill();

          }
        );

        ctx.shadowBlur = 0;

      }


      /* ======================================================
         ORBITING PARTICLES
      ====================================================== */

      function drawParticles() {

        const count =
          listening
            ? 22
            : 14;

        for (
          let i = 0;
          i < count;
          i++
        ) {

          const angle =
            time *
            (
              listening
                ? 0.00028
                : 0.00015
            ) +
            i *
            (
              Math.PI *
              2 /
              count
            );

          const distance =
            Math.min(
              width,
              height
            ) *
            (
              0.31 +
              0.035 *
              Math.sin(
                time *
                0.001 +
                i
              ) +
              audioLevel *
              0.04
            );

          const x =
            centerX +
            Math.cos(angle) *
            distance;

          const y =
            centerY +
            Math.sin(angle) *
            distance;

          ctx.fillStyle =
            i % 5 === 0
              ? `rgba(
                  255,
                  157,
                  53,
                  ${0.45 + audioLevel * 0.4}
                )`
              : `rgba(
                  75,
                  196,
                  240,
                  ${0.30 + audioLevel * 0.45}
                )`;

          ctx.beginPath();

          ctx.arc(
            x,
            y,
            1 +
            audioLevel *
            0.8,
            0,
            Math.PI * 2
          );

          ctx.fill();

        }

      }


      /* ======================================================
         ANIMATION LOOP
      ====================================================== */

      function animate(timestamp) {

        time =
          timestamp;

        ctx.clearRect(
          0,
          0,
          width,
          height
        );

        drawGlow();

        drawAudioRing();

        const positions =
          nodes.map(
            getNodePosition
          );

        drawConnections(
          positions
        );

        drawNodes(
          positions
        );

        drawParticles();

        requestAnimationFrame(
          animate
        );

      }


      /* ======================================================
         MICROPHONE
      ====================================================== */

      let stream = null;

      let audioContext = null;

      let analyser = null;

      let microphone = null;


      async function startListening() {

        if (listening) {

          stopListening();

          return;
        }


        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {

          voiceStatus.textContent =
            'Microphone unavailable in this browser.';

          voiceStatus.className =
            'voice-status error';

          return;

        }


        try {

          voiceStatus.textContent =
            'Requesting microphone…';

          voiceStatus.className =
            'voice-status listening';


          stream =
            await navigator.mediaDevices
              .getUserMedia({
                audio: true,
                video: false
              });


          audioContext =
            new (
              window.AudioContext ||
              window.webkitAudioContext
            )();


          analyser =
            audioContext
              .createAnalyser();

          analyser.fftSize =
            256;

          analyser.smoothingTimeConstant =
            0.68;


          microphone =
            audioContext
              .createMediaStreamSource(
                stream
              );


          microphone.connect(
            analyser
          );


          listening =
            true;


          voiceStatus.textContent =
            'Listening… tap again to stop';

          voiceStatus.className =
            'voice-status listening';


          monitorAudio();

        }

        catch (error) {

          console.error(
            error
          );

          voiceStatus.textContent =
            'Microphone permission was not allowed.';

          voiceStatus.className =
            'voice-status error';

        }

      }


      /* ======================================================
         AUDIO ENERGY
      ====================================================== */

      function monitorAudio() {

        if (
          !listening ||
          !analyser
        ) {
          return;
        }


        const data =
          new Uint8Array(
            analyser.frequencyBinCount
          );


        analyser.getByteFrequencyData(
          data
        );


        let total =
          0;


        for (
          let i = 0;
          i < data.length;
          i++
        ) {

          total +=
            data[i];

        }


        const average =
          total /
          data.length;


        /*
          Higher sensitivity than V1.
          Normal speech should now visibly
          activate Neo.
        */

        let target =
          average /
          38;


        /*
          Small dead zone prevents room noise
          from making Neo constantly flare.
        */

        if (target < 0.045) {
          target = 0;
        }


        target =
          Math.min(
            target,
            1
          );


        /*
          Faster attack, slower decay:
          Neo reacts quickly when you speak
          but settles smoothly.
        */

        if (
          target >
          audioLevel
        ) {

          audioLevel =
            audioLevel *
            0.48 +
            target *
            0.52;

        }

        else {

          audioLevel =
            audioLevel *
            0.82 +
            target *
            0.18;

        }


        requestAnimationFrame(
          monitorAudio
        );

      }


      /* ======================================================
         STOP MICROPHONE
      ====================================================== */

      function stopListening() {

        listening =
          false;

        audioLevel =
          0;


        if (stream) {

          stream
            .getTracks()
            .forEach(
              track =>
                track.stop()
            );

        }


        if (audioContext) {

          audioContext.close();

        }


        stream =
          null;

        audioContext =
          null;

        analyser =
          null;

        microphone =
          null;


        voiceStatus.textContent =
          'Microphone test successful';

        voiceStatus.className =
          'voice-status success';

      }


      /* ======================================================
         TAP NEO
      ====================================================== */

      canvas.addEventListener(
        'click',
        () => {

          canvas.animate(
            [
              {
                transform:
                  'scale(1)'
              },
              {
                transform:
                  'scale(1.035)'
              },
              {
                transform:
                  'scale(1)'
              }
            ],
            {
              duration:
                420,

              easing:
                'ease-out'
            }
          );


          startListening();

        }
      );


      /* ======================================================
         STARTUP
      ====================================================== */

      window.addEventListener(
        'resize',
        resize
      );


      resize();


      requestAnimationFrame(
        animate
      );

    })();
  </script>

</body>
</html>
